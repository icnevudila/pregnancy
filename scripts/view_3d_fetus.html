<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>MOMORA · 3D Fetüs Model Görüntüleyici</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #2C2033 0%, #120E17 100%);
      color: #FFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    .header-overlay {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 10;
      pointer-events: none;
    }
    .badge {
      display: inline-block;
      background: rgba(255, 180, 120, 0.15);
      color: #FFAE73;
      border: 1px solid rgba(255, 180, 120, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #FAF7F3;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    p {
      font-size: 13px;
      color: #BFA5C8;
      margin-top: 4px;
    }
    .controls-overlay {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(28, 26, 36, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 18px;
      border-radius: 30px;
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    button, select {
      background: #7D5286;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover, select:hover {
      background: #9B66A7;
      transform: translateY(-1px);
    }
    button.secondary, select {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    button.secondary:hover {
      background: rgba(255, 255, 255, 0.22);
    }
    select option {
      background: #2C2033;
      color: white;
    }
    .hint {
      position: absolute;
      bottom: 78px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(28, 26, 36, 0.95);
      border: 1px solid rgba(255, 174, 115, 0.3);
      padding: 24px 32px;
      border-radius: 20px;
      font-size: 14px;
      color: #FFD4B2;
      text-align: center;
      z-index: 20;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      max-width: 440px;
      line-height: 1.6;
    }
    #loading.success {
      display: none;
    }
    #loading a.btn-link {
      display: inline-block;
      margin-top: 14px;
      background: linear-gradient(135deg, #FF9966, #FF5E62);
      color: white;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
    }
    input[type="file"] {
      display: none;
    }
    .drag-notice {
      position: absolute;
      top: 20px;
      right: 24px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 11px;
      color: #D2C4D8;
    }
  </style>
  <!-- Three.js r128 UMD CDN (Standard Browser Script Support) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.18.1/meshopt_decoder.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div class="header-overlay">
    <div class="badge">HD-LIVE 3D FETAL MESH</div>
    <h1 id="titleText">Momora 3D Fetüs Modeli</h1>
    <p id="subText">7. Hafta Embriyo · TripoSR Poligon Mesh</p>
  </div>

  <div class="drag-notice">💡 GLB dosyasını sürükleyip buraya bırakabilirsiniz</div>

  <div id="loading">
    <div style="font-size: 24px; margin-bottom: 8px;">⏳</div>
    <div id="loadingMsg">3D Model Yükleniyor...</div>
  </div>

  <div class="hint">🖱️ Döndürmek için sürükleyin · Yakınlaştırmak için fare tekerleği</div>

  <div class="controls-overlay">
    <select id="modelSelect" style="display: none;">
      <option value="/assets/fetus_w07.glb">7. Hafta (fetus_w07.glb)</option>
    </select>
    <button id="autoRotateBtn">🔄 Otomatik Döndür</button>
    <button id="wireframeBtn" class="secondary">🕸️ Tel Kafes</button>
    <button id="amberGlowBtn" class="secondary">💡 Işık / Doku</button>
    <label for="fileInput">
      <button class="secondary" onclick="document.getElementById('fileInput').click()">📁 Farklı GLB Aç</button>
    </label>
    <input type="file" id="fileInput" accept=".glb,.gltf">
  </div>

  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById('canvas-container');
    const loadingEl = document.getElementById('loading');
    const loadingMsg = document.getElementById('loadingMsg');
    const modelSelect = document.getElementById('modelSelect');

    let scene, camera, renderer, controls, currentMesh;
    let autoRotate = true;
    let isWireframe = false;
    let amberTone = true;

    function init() {
      // 1. Three.js Sahnesi
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 3.2);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.3;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.autoRotate = false;

      // 2. Işıklandırma (HD-Live Fetal Aydınlatma)
      setupLights();

      // 3. UI Butonları ve Olaylar
      setupButtons();
      setupDragAndDrop();
      window.addEventListener('resize', onWindowResize);

      // 4. Modeli Yükle
      detectAndLoadModel();

      animate();
    }

    let ambientLight, mainLight, rimLight, fillLight;
    function setupLights() {
      ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
      scene.add(ambientLight);

      mainLight = new THREE.DirectionalLight(0xFFAA66, 2.5);
      mainLight.position.set(3, 4, 4);
      scene.add(mainLight);

      rimLight = new THREE.DirectionalLight(0x9E59A8, 2.0);
      rimLight.position.set(-3, -2, -3);
      scene.add(rimLight);

      fillLight = new THREE.DirectionalLight(0xFFE5D4, 1.8);
      fillLight.position.set(0, 0, 5);
      scene.add(fillLight);
    }

    let colorMode = 'original'; // 'original' | 'amber' | 'pink'

    function applyFetalMaterial(mesh) {
      mesh.traverse((child) => {
        if (child.isMesh) {
          if (child.geometry && !child.geometry.attributes.normal) {
            child.geometry.computeVertexNormals();
          }

          if (!child.userData.originalMaterial) {
            child.userData.originalMaterial = child.material.clone ? child.material.clone() : child.material;
          }

          if (colorMode === 'original') {
            child.material = child.userData.originalMaterial;
            child.material.wireframe = isWireframe;
            child.material.side = THREE.DoubleSide;
            const hasVertexColors = child.geometry && child.geometry.attributes.color;
            if (hasVertexColors && !child.material.map) {
              child.material.vertexColors = true;
            }
          } else {
            child.material = new THREE.MeshStandardMaterial({
              color: colorMode === 'pink' ? 0xE58D9B : 0xEE924A,
              roughness: 0.35,
              metalness: 0.08,
              side: THREE.DoubleSide,
              wireframe: isWireframe
            });
          }
        }
      });
    }

    function placeMeshInCenter(mesh) {
      if (currentMesh) scene.remove(currentMesh);
      currentMesh = mesh;
      applyFetalMaterial(currentMesh);

      // Otomatik bounding box ve merkeze oturtma
      const box = new THREE.Box3().setFromObject(currentMesh);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const targetScale = 1.6 / maxDim;

      currentMesh.scale.set(targetScale, targetScale, targetScale);
      currentMesh.position.set(
        -center.x * targetScale,
        -center.y * targetScale,
        -center.z * targetScale
      );

      scene.add(currentMesh);
      loadingEl.style.display = 'none';
    }

    function parseGLBArrayBuffer(arrayBuffer, name) {
      loadingEl.style.display = 'block';
      loadingMsg.innerText = (name || 'Model') + ' çözümleniyor...';
      const loader = new THREE.GLTFLoader();
      if (typeof MeshoptDecoder !== 'undefined') {
        loader.setMeshoptDecoder(MeshoptDecoder);
      }
      loader.parse(arrayBuffer, '', (gltf) => {
        placeMeshInCenter(gltf.scene);
        if (name) {
          document.getElementById('subText').innerText = name + ' · Ultra Kalite PBR 3D Mesh';
        }
      }, (err) => {
        console.error("GLTF Parse Error:", err);
        showError("Model verisi çözümlenemedi: " + (err.message || err));
      });
    }

    function detectAndLoadModel() {
      const isHttp = window.location.protocol.startsWith('http');
      const primaryUrl = isHttp ? '/assets/fetus_tripo_ultra.glb' : 'http://localhost:3456/assets/fetus_tripo_ultra.glb';
      const fallbackUrl = isHttp ? '/assets/fetus_w07.glb' : 'http://localhost:3456/assets/fetus_w07.glb';

      loadingEl.style.display = 'block';
      loadingMsg.innerHTML = "3D Fetüs Modeli yükleniyor...<br><span style='font-size:12px;opacity:0.7'>fetus_tripo_ultra.glb (11 MB)</span>";

      fetch(primaryUrl)
        .then(res => {
          if (!res.ok) return fetch(fallbackUrl).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); });
          return res.arrayBuffer();
        })
        .then(buffer => {
          parseGLBArrayBuffer(buffer, 'Tripo 3.1 Ultra Fetüs & Plasenta');
        })
        .catch(err => {
          console.warn("Otomatik fetch başarısız oldu:", err);
          // file:// protokolünde CORS engeli oluştuğunda:
          if (window.location.protocol === 'file:') {
            loadingEl.style.display = 'block';
            loadingEl.innerHTML = `
              <div style="font-size:22px; margin-bottom:8px;">🔒</div>
              <b>Tarayıcı Güvenlik Koruması (CORS)</b><br>
              <span style="font-size:12px; color:#C4B5CD; display:block; margin:6px 0 12px 0;">
                Google Chrome/Edge, <code>file:///</code> üzerinden doğrudan dosya yüklemeyi engeller.
              </span>
              <a class="btn-link" href="http://localhost:3456/3d">🚀 Hemen Yerel Sunucudan Aç (Tıklayın)</a>
              <div style="margin-top:14px; font-size:12px; color:#AA98B3;">
                veya aşağıdaki <b>"📁 Farklı GLB Aç"</b> butonuna basıp <code>assets/fetus_w07.glb</code> dosyasını seçebilirsiniz.
              </div>
            `;
          } else {
            showError("Model dosyası bulunamadı. Lütfen '📁 Farklı GLB Aç' butonuna basarak dosyayı seçin.");
          }
        });

      // Sunucudan mevcut modelleri al
      if (isHttp) {
        fetch('/models')
          .then(r => r.json())
          .then(data => {
            if (data.models && data.models.length > 0) {
              modelSelect.innerHTML = '';
              data.models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = '/assets/' + m;
                opt.innerText = m;
                modelSelect.appendChild(opt);
              });
              modelSelect.style.display = 'inline-block';
              modelSelect.addEventListener('change', (e) => {
                loadModelFromUrl(e.target.value, e.target.options[e.target.selectedIndex].text);
              });
            }
          })
          .catch(() => {});
      }
    }

    function loadModelFromUrl(url, displayName) {
      loadingEl.style.display = 'block';
      loadingMsg.innerText = (displayName || url) + ' yükleniyor...';
      fetch(url)
        .then(r => r.arrayBuffer())
        .then(buffer => parseGLBArrayBuffer(buffer, displayName))
        .catch(err => showError(err.message));
    }

    function showError(msg) {
      loadingEl.style.display = 'block';
      loadingEl.innerHTML = `<div style="color:#FF7B7B">⚠️ ${msg}</div>`;
    }

    function setupDragAndDrop() {
      window.addEventListener('dragover', (e) => {
        e.preventDefault();
      });
      window.addEventListener('drop', (e) => {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (file && (file.name.endsWith('.glb') || file.name.endsWith('.gltf'))) {
          const reader = new FileReader();
          reader.onload = (ev) => parseGLBArrayBuffer(ev.target.result, file.name);
          reader.readAsArrayBuffer(file);
        }
      });
    }

    function setupButtons() {
      document.getElementById('autoRotateBtn').addEventListener('click', () => {
        autoRotate = !autoRotate;
      });

      document.getElementById('wireframeBtn').addEventListener('click', () => {
        isWireframe = !isWireframe;
        if (currentMesh) {
          currentMesh.traverse((c) => {
            if (c.isMesh) c.material.wireframe = isWireframe;
          });
        }
      });

      document.getElementById('amberGlowBtn').addEventListener('click', () => {
        if (colorMode === 'original') colorMode = 'amber';
        else if (colorMode === 'amber') colorMode = 'pink';
        else colorMode = 'original';

        const labels = {
          'original': '💡 Orijinal Renk',
          'amber': '💡 HD-Live Kehribar',
          'pink': '💡 Rahim İçi Pembe'
        };
        document.getElementById('amberGlowBtn').innerText = labels[colorMode];
        if (currentMesh) applyFetalMaterial(currentMesh);
      });

      document.getElementById('fileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => parseGLBArrayBuffer(event.target.result, file.name);
          reader.readAsArrayBuffer(file);
        }
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (autoRotate && currentMesh) {
        currentMesh.rotation.y += 0.007;
      }
      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
